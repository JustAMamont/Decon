[workspace]
resolver = "2"
members = [
    "crates/decon-core",
    "crates/decon-trainers",
    "crates/decon-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/JustAMamont/Decon"

[workspace.dependencies]
decon-core = { path = "crates/decon-core" }
decon-trainers = { path = "crates/decon-trainers" }

# Runtime
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.29", features = ["v7", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2.0"

# Crypto (pure Rust, no OpenSSL — Windows-friendly)
fernet = { version = "0.2", default-features = false, features = ["rustcrypto"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand = { version = "0.8", default-features = false, features = ["std_rng"] }
base64 = "0.22"

# Dev
criterion = "0.5"
proptest = "1.4"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
